name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without a leading v (for example 1.0.1)'
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest

    permissions:
      id-token: write     # issue the OIDC token NuGet exchanges for a short-lived key
      contents: write     # create the GitHub release

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install .NET 8 runtime
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # The tag is the authority on the version. A tag of v1.2.3 publishes
      # 1.2.3; v1.2.3-rc1 publishes that prerelease.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "'$version' is not a version. Tag releases as v1.2.3 or v1.2.3-rc1."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "publishing $version"

      # Never publish something that does not pass its own tests.
      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: >
          dotnet pack -c Release -o artifacts
          -p:VersionPrefix=${{ steps.version.outputs.version }}
          -p:VersionSuffix=

      - name: List packages
        shell: pwsh
        run: Get-ChildItem artifacts | Select-Object Name, Length | Format-Table -AutoSize

      # Fails here with a clear message rather than inside the OIDC exchange,
      # where an empty username surfaces as an opaque authentication error.
      - name: Check publishing configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw "The NUGET_USER repository secret is empty. Set it to your " +
                  "nuget.org profile name (not your email address)."
          }

          Write-Host "publishing as nuget.org user '$env:NUGET_USER'"

      # Trusted publishing: GitHub issues a signed OIDC token describing this
      # repository and workflow, NuGet checks it against the policy configured on
      # nuget.org, and returns an API key valid for one hour and usable once.
      # Requested here rather than earlier so it cannot expire before the push.
      - name: Exchange OIDC token for a NuGet key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        shell: pwsh
        run: |
          # Enumerated rather than passed as a glob: dotnet nuget push does not
          # expand wildcards, and quoting stops the shell from doing it either.
          $packages = Get-ChildItem artifacts -Filter *.nupkg

          if ($packages.Count -eq 0) { throw "no packages found in artifacts" }

          foreach ($package in $packages) {
            Write-Host "pushing $($package.Name)"

            # Pushing the .nupkg also pushes the matching .snupkg to nuget.org.
            dotnet nuget push $package.FullName `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) { throw "push failed for $($package.Name)" }
          }

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: PunchIO ${{ steps.version.outputs.version }}
          # A version with a hyphen is a prerelease by SemVer, and GitHub does
          # not infer that from the tag.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: artifacts/*
